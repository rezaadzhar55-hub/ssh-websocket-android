plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rezadzhar.sshwebsocket'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rezadzhar.sshwebsocket'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.mwiede:jsch:0.2.25'
    testImplementation 'junit:junit:4.13.2'
}
